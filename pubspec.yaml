name: sokna
description: "Sokna - Application mobile Flutter de recherche et publication de locations immobilieres en Tunisie."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  dartz: ^0.10.1
  get_it: ^9.3.0
  go_router: ^18.1.4
  http: ^1.6.0
  shared_preferences: ^2.5.6
  internet_connection_checker: ^3.0.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  validators: ^3.0.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/listings.json

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
